<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kardashev Tech Tree 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Segoe UI',sans-serif; color:#fff; }
canvas { display:block; }

#hud {
  position:fixed; top:0; left:0; right:0; z-index:10;
  display:flex; align-items:center; gap:16px; padding:11px 24px;
  background:rgba(0,0,8,0.88); border-bottom:1px solid rgba(99,102,241,0.25);
  pointer-events:none;
}
#hud h1 {
  font-size:15px; font-weight:800; letter-spacing:2px;
  background:linear-gradient(90deg,#818cf8,#38bdf8,#34d399);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
#hud .hint { font-size:10px; color:#475569; margin-left:auto; white-space:nowrap; overflow:hidden; }

/* Side Panel */
#side {
  position:fixed; top:0; left:-420px; width:380px; height:100vh;
  background:rgba(3,7,18,0.97); border-right:1px solid rgba(99,102,241,0.3);
  backdrop-filter:blur(20px); z-index:50; overflow-y:auto;
  transition:left 0.4s cubic-bezier(0.22,1,0.36,1);
}
#side.open { left:0; }
#side-inner { padding:68px 22px 40px; }
#side-close {
  position:absolute; top:12px; right:12px; width:28px; height:28px;
  border-radius:50%; border:1px solid rgba(99,102,241,0.4);
  background:rgba(99,102,241,0.1); color:#818cf8; font-size:13px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
#side-close:hover { background:rgba(99,102,241,0.35); color:#fff; }
.s-badge { display:inline-block; font-size:10px; font-weight:800; padding:2px 10px; border-radius:20px; margin-bottom:10px; letter-spacing:1px; }
.s-title { font-size:19px; font-weight:900; margin-bottom:3px; }
.s-cat { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.s-year { font-size:24px; font-weight:900; margin-bottom:14px; }
.s-hr { height:1px; background:rgba(99,102,241,0.15); margin:12px 0; }
.s-lbl { font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:#475569; margin-bottom:4px; display:block; }
.s-val { font-size:12px; color:#cbd5e1; line-height:1.75; margin-bottom:12px; }
.s-diff { color:#fbbf24; font-size:14px; margin-bottom:12px; }
.chip { display:inline-block; font-size:10px; padding:2px 9px; border-radius:10px; border:1px solid rgba(99,102,241,0.35); background:rgba(99,102,241,0.12); color:#818cf8; margin:2px 2px 0 0; cursor:pointer; }
.chip:hover { background:rgba(99,102,241,0.3); color:#fff; }

/* Filters */
#filters { position:fixed; top:52px; right:16px; display:flex; flex-direction:column; gap:4px; z-index:10; }
.fbtn { padding:4px 12px; border-radius:20px; border:1px solid; font-size:10px; font-weight:700; cursor:pointer; backdrop-filter:blur(8px); }
.fbtn:not(.on) { opacity:0.25; }

/* Controls */
#ctrl { position:fixed; bottom:18px; left:18px; display:flex; flex-direction:column; gap:7px; z-index:10; }
.cbtn { width:34px; height:34px; border-radius:8px; border:1px solid rgba(99,102,241,0.4); background:rgba(5,10,30,0.8); color:#818cf8; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.cbtn:hover { background:rgba(99,102,241,0.3); color:#fff; }
.cbtn.active { color:#34d399; border-color:#34d399; }

/* Legend */
#legend { position:fixed; bottom:18px; right:16px; background:rgba(3,7,18,0.85); border:1px solid rgba(99,102,241,0.2); border-radius:10px; padding:9px 13px; font-size:10px; color:#64748b; z-index:10; }
#legend div { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
#legend .d { width:8px; height:8px; border-radius:50%; }

/* Simulation badge */
#sim-status { position:fixed; top:52px; left:18px; font-size:10px; color:#34d399; z-index:10; opacity:0; transition:opacity 0.5s; }
#sim-status.show { opacity:1; }

/* Intro overlay */
#intro {
  position:fixed; inset:0; z-index:1000; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:#000008;
  pointer-events:none;
  transition:opacity 1.2s ease;
}
#intro.hidden { opacity:0; }
#intro-title {
  font-size:clamp(22px,4vw,52px); font-weight:900; letter-spacing:6px;
  background:linear-gradient(90deg,#818cf8,#38bdf8,#34d399,#fbbf24);
  background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation:shimmer 3s linear infinite; opacity:0; transform:scale(0.8);
  transition:opacity 0.8s ease, transform 0.8s ease;
}
#intro-title.show { opacity:1; transform:scale(1); }
#intro-sub {
  margin-top:14px; font-size:13px; letter-spacing:3px; color:#38bdf8;
  opacity:0; transition:opacity 0.8s ease 0.4s;
}
#intro-sub.show { opacity:1; }
#intro-bar {
  margin-top:40px; width:240px; height:2px; background:rgba(99,102,241,0.2); border-radius:2px; overflow:hidden;
  opacity:0; transition:opacity 0.5s ease 0.6s;
}
#intro-bar.show { opacity:1; }
#intro-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#818cf8,#38bdf8); transition:width 2.5s cubic-bezier(0.25,1,0.5,1); }
@keyframes shimmer { to { background-position:200% center; } }

/* Background Canvas */
#bg-canvas {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  transition: opacity 1.5s ease;
}

/* UNLOCK FX */
#unlock-fx {
  position:fixed; inset:0; z-index:500; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
#unlock-text {
  font-size:clamp(32px,6vw,80px); font-weight:900; letter-spacing:8px;
  color:#fff; text-shadow: 0 0 40px currentColor;
  opacity:0; transform:scale(0.5);
  transition: opacity 0.2s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
#unlock-text.pop { opacity:1; transform:scale(1); }
#unlock-text.fade { opacity:0; transform:scale(1.2); transition: opacity 0.6s, transform 0.6s; }
#flash-overlay {
  position:fixed; inset:0; z-index:490; background:#fff; opacity:0; pointer-events:none;
  transition: opacity 0.15s;
}

/* ── モバイル対応 ── */
.hint-mobile { display:none; font-size:10px; color:#475569; margin-left:auto; white-space:nowrap; }

/* メディアクエリ (主要手段) */
@media (max-width:768px) {
  #hud { padding:8px 12px; gap:8px; }
  #hud h1 { font-size:12px; letter-spacing:1px; }
  #hud .hint { display:none; }
  .hint-mobile { display:block; }
  #progress-hud { display:none !important; }
  #side { width:100vw; left:-100vw; }
  #side-inner { padding:60px 16px 80px; }
  #ctrl { bottom:auto; top:46px; left:8px; flex-direction:row; gap:6px; }
  .cbtn { width:40px; height:40px; font-size:18px; border-radius:10px; }
  #filters { top:auto; bottom:0; right:0; left:0; flex-direction:row; overflow-x:auto; gap:6px; padding:8px 12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; background:rgba(0,0,8,0.88); backdrop-filter:blur(10px); border-top:1px solid rgba(99,102,241,0.2); }
  #filters::-webkit-scrollbar { display:none; }
  .fbtn { white-space:nowrap; flex-shrink:0; font-size:10px; padding:4px 12px; }
  #legend { bottom:52px; right:8px; font-size:8px; padding:6px 10px; }
  #sim-status { top:92px; left:8px; bottom:auto; }
}
/* JSクラス補完 (body.is-mobile が JS で付与される) */
body.is-mobile #hud { padding:8px 12px; gap:8px; }
body.is-mobile #hud h1 { font-size:12px; letter-spacing:1px; }
body.is-mobile #hud .hint { display:none; }
body.is-mobile .hint-mobile { display:block; }
body.is-mobile #progress-hud { display:none !important; }
body.is-mobile #side { width:100vw; left:-100vw; }
body.is-mobile #side-inner { padding:60px 16px 80px; }
body.is-mobile #ctrl { bottom:auto; top:46px; left:8px; flex-direction:row; gap:6px; }
body.is-mobile .cbtn { width:40px; height:40px; font-size:18px; border-radius:10px; }
body.is-mobile #filters { top:auto; bottom:0; right:0; left:0; flex-direction:row; overflow-x:auto; gap:6px; padding:8px 12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; background:rgba(0,0,8,0.88); backdrop-filter:blur(10px); border-top:1px solid rgba(99,102,241,0.2); }
body.is-mobile #filters::-webkit-scrollbar { display:none; }
body.is-mobile .fbtn { white-space:nowrap; flex-shrink:0; font-size:10px; padding:4px 12px; }
body.is-mobile #legend { bottom:52px; right:8px; font-size:8px; padding:6px 10px; }
body.is-mobile #sim-status { top:92px; left:8px; bottom:auto; }
</style>
</head>

<script>
// ─────────────────────────────────────────────────────
// MOBILE CLASS DETECTION
// ─────────────────────────────────────────────────────
(function(){
  if(window.innerWidth<768||'ontouchstart' in window||navigator.maxTouchPoints>0)
    document.body.classList.add('is-mobile');
})();
window.addEventListener('resize',function(){
  document.body.classList.toggle('is-mobile',window.innerWidth<768);
});

// ─────────────────────────────────────────────────────
// BACKGROUND CANVAS ANIMATION
// ─────────────────────────────────────────────────────
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let currentBgLevel = null;
let bgParticles = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

const BG_CONFIGS = {
  '-2': {
    gradient: ['#1a0f00','#2d1500','#0d0800'],
    particles: { count:30, color:'#ff6600', size:1.5, speed:0.2, glow:15 },
    desc: '火と闇——洞窟の夜'
  },
  '-1': {
    gradient: ['#000d1a','#001a2e','#000510'],
    particles: { count:60, color:'#ffd700', size:1, speed:0.3, glow:8 },
    desc: '蒸気と星——産業の夜明け'
  },
  '0': {
    gradient: ['#000510','#001020','#020818'],
    particles: { count:100, color:'#38bdf8', size:1, speed:0.4, glow:10 },
    desc: '情報の海——デジタル文明'
  },
  '4': {
    gradient: ['#000a10','#001a14','#000c18'],
    particles: { count:120, color:'#34d399', size:0.8, speed:0.5, glow:12 },
    desc: 'AIの神経網——データの光'
  },
  '1': {
    gradient: ['#050010','#100020','#000010'],
    particles: { count:150, color:'#818cf8', size:0.8, speed:0.6, glow:15 },
    desc: '恒星制御——太陽系の支配'
  },
  '2': {
    gradient: ['#080010','#150025','#050015'],
    particles: { count:200, color:'#fbbf24', size:0.6, speed:0.8, glow:20 },
    desc: '銀河制御——星々の主'
  },
  '3': {
    gradient: ['#0a0015','#1a002a','#050020'],
    particles: { count:300, color:'#e879f9', size:0.5, speed:1.0, glow:25 },
    desc: '超越——宇宙の設計者'
  }
};

function initBgParticles(config) {
  bgParticles = [];
  for(let i=0; i<config.count; i++) {
    bgParticles.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      vx: (Math.random()-0.5) * config.speed,
      vy: (Math.random()-0.5) * config.speed,
      size: config.size * (0.5 + Math.random()),
      opacity: Math.random(),
      pulse: Math.random() * Math.PI * 2
    });
  }
}

function drawBg(levelKey) {
  const cfg = BG_CONFIGS[String(levelKey)];
  if(!cfg) return;
  const w = bgCanvas.width, h = bgCanvas.height;
  const grd = bgCtx.createRadialGradient(w/2,h/2,0, w/2,h/2,Math.max(w,h)*0.7);
  grd.addColorStop(0, cfg.gradient[1]);
  grd.addColorStop(0.5, cfg.gradient[0]);
  grd.addColorStop(1, cfg.gradient[2]);
  bgCtx.fillStyle = grd;
  bgCtx.fillRect(0,0,w,h);
  bgParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x<0) p.x=w; if(p.x>w) p.x=0;
    if(p.y<0) p.y=h; if(p.y>h) p.y=0;
    p.pulse += 0.02;
    const op = 0.3 + 0.7 * (Math.sin(p.pulse) * 0.5 + 0.5);
    bgCtx.save();
    bgCtx.globalAlpha = op * 0.8;
    bgCtx.shadowBlur = cfg.particles.glow;
    bgCtx.shadowColor = cfg.particles.color;
    bgCtx.fillStyle = cfg.particles.color;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    bgCtx.fill();
    bgCtx.restore();
  });
  bgCtx.save();
  bgCtx.globalAlpha = 0.04;
  bgCtx.fillStyle = cfg.particles.color;
  bgCtx.font = `bold ${Math.min(w*0.06, 60)}px 'Segoe UI'`;
  bgCtx.textAlign = 'center';
  bgCtx.fillText(cfg.desc, w/2, h*0.92);
  bgCtx.restore();
}

let bgAnimFrame;
function startBgAnim(levelKey) {
  if(bgAnimFrame) cancelAnimationFrame(bgAnimFrame);
  const cfg = BG_CONFIGS[String(levelKey)];
  if(!cfg) return;
  currentBgLevel = levelKey;
  initBgParticles(cfg.particles);
  function loop() {
    drawBg(levelKey);
    bgAnimFrame = requestAnimationFrame(loop);
  }
  loop();
}

startBgAnim('-2');

};

   scale:"火1つで夜の行動時間が2〜3倍に。調理により摂取カロリーが40%増加",
   media:"🎬 『2001年宇宙の旅』(1968) — 猿人が骨を武器に使う冒頭シーン。火ではなく道具だが、知性の覚醒の象徴として描かれる。📚 ジャン・M・オール『大地の子エイラ』— 原始人の日常と火の支配を克明に描く",
   episode:"夕暮れ、サバンナの洞窟の前で老いたエレクトスが火を守っている。子どもたちが焼けた肉の骨を齧り、夜の獣が近づかない。彼は「火が仲間だ」とまだ言葉にできないまま、炎を見つめてうとうとした。"},
  {id:"PR2",t:-2,cat:"原始技術",   name:"石器製造",            year:"BC 260万年",diff:1,prereq:"手の器用さ・観察力",breakthrough:"狩猟効率の劇的向上",unlock:"農業革命の前提",mile:"オルドヴァイ石器文化の確立",
   scale:"石器あり/なしで狩猟成功率：約3倍の差",
   media:"🎬 『アポカリプト』(2006) — マヤ文明の石器・道具が生々しく描かれる。📚 『西の洞窟の少年』— 石器を作る過程が少年の成長と重なるサバイバル小説",
   episode:"川原でひとりの若者が黒曜石を打ち欠いている。三十回失敗してようやく鋭い刃が生まれた瞬間、彼は小さく吠えた。その刃で翌朝の猪の腱を断ち切り、集落は三日間食べ物に困らなかった。"},
  {id:"PR3",t:-2,cat:"原始技術",   name:"言語・記号体系",      year:"BC 10万年", diff:2,prereq:"脳の大型化・社会的生活",breakthrough:"知識の世代間伝達",unlock:"文字・数学・科学の根本",mile:"複雑な構文を持つ言語の発生",
   scale:"言語により知識伝達速度が遺伝子進化の10万倍に",
   media:"🎬 『メッセージ』(2016) — 異星人の言語を解読する言語学者の話。言語が思考を変えることを描く傑作。📚 テッド・チャン『あなたの人生の物語』— 映画原作。言語と時間認識の関係を探る",
   episode:"老婆が孫に「川の向こうの赤い木の実は食べるな、腹が腐る」と語った。孫はその木に近づかなかった。言葉がなければ何千回も同じ過ちを繰り返すしかなかった——その夜、火を囲みながら物語が生まれた。"},
  {id:"PR4",t:-2,cat:"原始技術",   name:"農業革命",            year:"BC 1万年",  diff:2,prereq:"石器・火・気候安定化",breakthrough:"余剰食料→都市・分業・階級",unlock:"文明・数学・天文学",mile:"メソポタミア・黄河での麦/稲作確立",
   scale:"農業で1人が10人分の食料生産可能に。都市文明の直接原因",
   media:"📚 ユヴァル・ノア・ハラリ『サピエンス全史』— 農業革命を「人類最大の詐欺」と喝破するノンフィクション。🎬 『テラ・フォーマーズ』— 惑星改造と農業的植民の思想を含むSF",
   episode:"ユーフラテス河岸で女が麦の穂を土に埋めた。秋、同じ場所に穂が立ち並んだのを見て彼女は呆然とした。次の年、彼女の一族は冬を飢えずに越えた。狩りに出なかった男たちは日干し煉瓦を積み始めた。"},
  {id:"PR5",t:-2,cat:"原始技術",   name:"冶金術（銅・青銅）",  year:"BC 5000年", diff:2,prereq:"火の利用・鉱石の認識",breakthrough:"金属工具で農業・建設・戦争が変容",unlock:"鉄器・錬金術・化学の萌芽",mile:"青銅器時代の幕開け",
   scale:"青銅製鎌は石器の2倍の効率。武器・農具・建築ツール全てを変えた",
   media:"🎬 『ロード・オブ・ザ・リング』— ドワーフの鍛冶技術・ミスリル・指輪の鍛造が中心的テーマ。📚 アーシュラ・K・ル=グウィン『世界の誕生日』— 金属と文明の関係を神話的に描く",
   episode:"炉の番人の少年が緑色の石（孔雀石）を誤って炉に落とした。翌朝、溶けて固まった赤い金属を見た父親は震えた。それを薄く叩いて鎌を作ると、石器の倍の速さで麦を刈れた——少年の「失敗」が時代を変えた。"},
  {id:"PR6",t:-2,cat:"原始技術",   name:"文字・数学の発明",    year:"BC 3500年", diff:2,prereq:"言語・農業・都市形成",breakthrough:"知識の客観的記録・数量化",unlock:"幾何学・天文学・論理学",mile:"シュメール楔形文字・ヒエログリフ確立",
   scale:"文字以前：情報は1人の頭の中のみ。文字後：情報は人類全体の共有財産",
   media:"🎬 『ウォール・E』— 文字・記録が失われた未来社会の警告。📚 ニール・スティーヴンスン『スノウ・クラッシュ』— 言語・記号が意識をハックするSF",
   episode:"ウルクの倉庫番が粘土板に刻まれた記号を指でなぞる。「大麦37袋、受け取り済」——彼の頭では覚えきれない量だが、板は嘘をつかない。三千年後、その粘土板が発掘され、人類最古の「領収書」と呼ばれた。"},
  {id:"PR7",t:-2,cat:"原始技術",   name:"車輪・機械の原理",    year:"BC 3500年", diff:2,prereq:"冶金術・農業",breakthrough:"輸送・製造の効率革命",unlock:"機械工学・歯車・滑車",mile:"轆轤・車輪馬車の確立",
   scale:"車輪なし：人間が1日運べる荷物=50kg。車輪あり：500kg",
   media:"🎬 『マッドマックス：怒りのデス・ロード』— 車輪・機械・輸送が文明の象徴として描かれる。📚 アシモフ『ファウンデーション』— 技術の継承と伝播がテーマ",
   episode:"陶工が轆轤を回しながら壺を成形している。隣で荷車を引く牛が泥道に車輪を沈ませた。御者が舌打ちした——だが彼は知らなかった。その木の円盤が、五千年後に宇宙ロケットの部品を運ぶ工場の原型になることを。"},
  {id:"MD1",t:-1,cat:"数学・論理", name:"ユークリッド幾何学",  year:"BC 300年",  diff:2,prereq:"文字・数学・論理的演繹",breakthrough:"空間の公理的記述・証明の概念",unlock:"微積分・物理学・工学設計",mile:"原論13巻の完成",
   scale:"ピラミッド建設に幾何学必須。2500年後に橋・建物・GPS計算の基礎となる",
   media:"🎬 『コンタクト』(1997) — 素数・数学的秩序が宇宙知性の証として登場。📚 グレッグ・イーガン『しあわせの理由』— 数学的宇宙論をテーマにしたハードSF",
   episode:"アレクサンドリアの学院で若い書記がユークリッドの証明を書き写している。「なぜ三角形の内角の和が180度だと言い切れるのか？」と問うと、老師は砂に図を描いて見せた。その夜、少年は初めて「真実には根拠がある」と理解した。"},
  {id:"MD2",t:-1,cat:"数学・論理", name:"代数学・アルゴリズム",year:"820年",     diff:2,prereq:"文字・インドのゼロ概念",breakthrough:"未知数を記号化・解法の体系化",unlock:"微積分・暗号・コンピュータ科学",mile:"フワーリズミー『代数学』",
   scale:"アルゴリズムなしにコンピュータは存在できない。全デジタル文明の根",
   media:"📚 ニール・スティーヴンスン『クリプトノミコン』— 暗号・数学・アルゴリズムが縦横に絡む大作。🎬 『イミテーション・ゲーム』— チューリングとアルゴリズムの誕生を描く",
   episode:"バグダードの学者フワーリズミーが油商人の帳簿を見た。「x袋仕入れてy枚で売り……」複雑な計算を記号で整理し始める。「これを手順通りにやれば誰でも解ける」——1200年後、その「手順＝アルゴリズム」が全コンピュータの心臓になった。"},
  {id:"MD3",t:-1,cat:"数学・論理", name:"微積分の発明",        year:"1687年",    diff:3,prereq:"幾何学・代数学・解析幾何",breakthrough:"変化率・面積・物理法則の数学的記述",unlock:"古典力学・電磁気学・量子力学の全て",mile:"ニュートン『プリンキピア』",
   scale:"微積分なしに月ロケットの軌道計算は不可能。現代物理学の唯一の言語",
   media:"📺 『ドクター・ストレンジ』— 物理法則の操作として微積分的世界観。📚 デイヴィッド・フォスター・ウォレス『∞の話』— 無限・極限概念を文学として昇華",
   episode:"ニュートンがペスト疎開中の農場で林檎の落ちる速さを眺めている。「落ちる速さは刻一刻と変わる——その変化の変化を計算できないか？」羽根ペンを走らせ続けた翌朝、微分の萌芽が紙の上にあった。"},
  {id:"MD4",t:-1,cat:"物理・化学", name:"古典力学の確立",      year:"1687年",    diff:3,prereq:"微積分・望遠鏡・実験",breakthrough:"運動・重力の数学的法則化",unlock:"軌道力学・機械工学・宇宙旅行設計",mile:"万有引力の法則・運動三法則",
   scale:"砲弾の弾道から惑星軌道まで同じ式で記述。宇宙は数学的秩序の上にある",
   media:"🎬 『インターステラー』(2014) — 重力・相対性を軸にした宇宙SF。キップ・ソーン監修で物理的に正確。📚 アシモフ『神々自身』— 物理定数が違う宇宙との接触を描く",
   episode:"ロンドンの職人が大砲の弾道を計算している。以前は「勘と経験」だったが、今は式に数字を入れれば着弾点が出る。王立協会の書に書いてあった。「宇宙全体が同じ法則で動いている」——彼は砲弾を磨きながら夜空を仰いだ。"},
  {id:"MD5",t:-1,cat:"物理・化学", name:"電磁気学の確立",      year:"1865年",    diff:3,prereq:"微積分・ファラデー実験",breakthrough:"電気・磁気・光の統一理論",unlock:"発電機・無線通信・レーザー",mile:"マクスウェル方程式の完成",
   scale:"電磁波の発見がラジオ・TV・WiFi・5G・レーダー・電子レンジ全てを生んだ",
   media:"🎬 『テスラ』(2020) — 交流電流・電磁気学をめぐるテスラとエジソンの戦いを描く。📺 『プレステージ』— テスラが発明した交流技術がキーアイテム",
   episode:"エジンバラの下宿でマクスウェルが夜中に方程式を書き直している。「電場の変化が磁場を生み、磁場の変化が電場を生む——これは波として空間を伝わるはずだ」。計算した速度は光速と一致した。彼は椅子から立ち上がり、窓の外の星を見た。"},
  {id:"MD6",t:-1,cat:"物理・化学", name:"熱力学の確立",        year:"1850年",    diff:3,prereq:"古典力学・実験",breakthrough:"エネルギー保存・エントロピー概念",unlock:"蒸気機関最適化・統計力学",mile:"熱力学第一・第二法則",
   scale:"蒸気機関の効率改善で産業革命が加速。エントロピー概念が宇宙の終末を予言",
   media:"📚 トマス・ピンチョン『重力の虹』— エントロピーが主要テーマの前衛文学。🎬 『サンシャイン2057』— 太陽エネルギーと熱力学の極限に迫るSF",
   episode:"マンチェスターの機関士が蒸気機関の効率を記録している。「石炭を増やしても仕事量はある割合以上増えない——なぜだ？」クラウジウスの論文を読んで、彼はようやく理解した。宇宙は常に乱雑さに向かう、それが熱機関の壁だと。"},
  {id:"MD7",t:-1,cat:"物理・化学", name:"原子論・化学結合論",  year:"1803年",    diff:3,prereq:"錬金術から化学へ・実験",breakthrough:"物質の原子構造の解明",unlock:"有機化学・材料科学・核物理学",mile:"ドルトン原子論・周期表",
   scale:"原子番号の発見で118種の元素が整理された。全化学産業の設計図",
   media:"🎬 『オッペンハイマー』(2023) — 原子構造の理解が核爆弾に至る過程を描くノーラン作品。📚 リチャード・ファインマン『ご冗談でしょう、ファインマンさん』— 物理の楽しさを語る名著",
   episode:"マンチェスターで染料職人がなぜ特定の布だけに色が染まるのか不思議に思っていた。化学者ドルトンは「物質は目に見えない粒でできていて、粒同士が特定の相手としか結合しない」と説明した。職人は半信半疑だったが、その原理で新色の染料が生まれた。"},
  {id:"MD8",t:-1,cat:"生物・医学", name:"進化論・遺伝学",      year:"1859年",    diff:3,prereq:"博物学・顕微鏡",breakthrough:"生命の多様性・遺伝の物理的基盤",unlock:"分子生物学・遺伝子工学",mile:"ダーウィン『種の起源』",
   scale:"進化論がなければ抗生物質耐性も予測できない。医学・農業・AIの基盤",
   media:"🎬 『ジュラシック・パーク』— 遺伝子・進化・生命操作の倫理を問う。📚 ダン・シモンズ『ハイペリオン』— 進化と知性の未来を描くSF叙事詩",
   episode:"ガラパゴスでダーウィンが十三種類のフィンチのくちばしをスケッチしている。「なぜ同じ鳥がこれほど違う形に？」帰国後二十年間、彼は証拠を積み上げた。出版日の朝、彼は「これで神学者たちが怒る」と妻に囁いた。"},
  {id:"MD9",t:-1,cat:"工業",       name:"蒸気機関・産業革命",  year:"1769年",    diff:2,prereq:"熱力学・古典力学・冶金",breakthrough:"人力から化石燃料エネルギーへ",unlock:"電力インフラ・化学工業・大量生産",mile:"ワット蒸気機関の商用化",
   scale:"人間1人の筋力：0.1kW。蒸気機関：100kW。1000倍のエネルギー革命",
   media:"📚 ウィリアム・ギブスン＆ブルース・スターリング『ディファレンス・エンジン』— 蒸気機関でコンピュータが生まれた世界を描くスチームパンクSF。🎬 『フロム・ヘル』— 産業革命ロンドンの暗部を描く",
   episode:"バーミンガムの少女が工場の紡績機の前に立っている。以前は家で一本一本糸を紡いでいた。今は機械が百本同時に動く。母の仕事は消えたが、綿糸の値段は十分の一になり、家族全員が初めてシャツを二枚持てた。"},
  {id:"MD10",t:-1,cat:"工業",      name:"電力インフラの確立",  year:"1882年",    diff:2,prereq:"電磁気学・蒸気機関",breakthrough:"エネルギーを遠距離で伝送・利用",unlock:"通信・コンピュータ・現代文明全般",mile:"エジソン発電所／テスラ交流システム",
   scale:"電力なしに現代都市は1時間も機能しない。全デジタル社会の生命線",
   media:"🎬 『ソーシャル・ネットワーク』— 電力インフラの上に立つデジタル時代の幕開けを象徴。📚 トマス・エジソン対ニコラ・テスラ——実際の歴史が最高のSFを超えている",
   episode:"1882年9月4日夜、ニューヨークのパール街で電灯が一斉に点いた。馬車の御者が空を見上げた。「ガス灯より白い……太陽みたいだ」。翌朝の新聞には「闇が征服された」と書かれた。三十年後、その電線は大陸を覆った。"},
  {id:"A1",t:4,cat:"情報科学",     name:"汎用人工知能(AGI)",   year:"2040年頃",  diff:5,prereq:"深層学習・強化学習・LLM",breakthrough:"人間レベルの汎用推論と創造性",unlock:"全技術研究の自動加速",mile:"チューリングテスト完全通過＋自己改善ループ",
   media:"🎬 『エクス・マキナ』(2015) — 人工知能の意識と自律を問う密室劇。📚 ニック・ボストロム『スーパーインテリジェンス』— AGIのリスクを体系的に論じた必読書。🎬 『her/世界でひとつの彼女』— AGIとの関係性を詩的に描く",
   episode:"2041年、研究者がAGIに「核融合炉の未解決問題を解いてほしい」と依頼した。三時間後、AGIは新しい磁場制御論文を五十本生成した。一本を読んだ物理学者が震える手でコーヒーを置いた。「これは……私が三十年考えていた問題の答えだ」"},
  {id:"A2",t:4,cat:"情報科学",     name:"量子コンピュータ",    year:"2035年頃",  diff:4,prereq:"量子エラー訂正・トポロジカルキュービット",breakthrough:"ショアのアルゴリズム商用化",unlock:"材料設計計算10^6倍高速化",mile:"1000論理量子ビット・フォールトトレラント",
   media:"📚 グレッグ・イーガン『ディアスポラ』— 量子計算で動く仮想知性体の1000万年を描くハードSF。🎬 『アントマン』— 量子世界を視覚化した映画",
   episode:"2036年、薬品会社の研究員が量子コンピュータに新薬候補分子の計算を依頼した。従来なら十年かかるシミュレーションが三日で終わった。画面に表示された分子構造を見て、彼女は「これがアルツハイマーを止める鍵かもしれない」と呟いた。"},
  {id:"A3",t:4,cat:"情報科学",     name:"エクサスケール計算",   year:"2030年頃",  diff:3,prereq:"光子コンピューティング・3D積層半導体",breakthrough:"気候/核融合シミュレーション精度向上",unlock:"全球気象10年予測",mile:"10^18 FLOPS 常時稼働",
   media:"🎬 『デイ・アフター・トゥモロー』— 気候シミュレーションが警告を出す場面から始まる。📺 『ウエストワールド』— 巨大計算で人間の行動を予測するAI",
   episode:"2031年、気象予報士が端末を見ている。「来年の夏、バングラデシュに大洪水が来る」——十ヶ月前の予測が初めて可能になった。政府は堤防工事を急いだ。洪水は来たが、死者はゼロだった。"},
  {id:"A4",t:4,cat:"情報科学",     name:"ブレインコンピュータIF",year:"2050年頃", diff:4,prereq:"神経科学・ナノ電極・信号処理",breakthrough:"思考速度でのデジタル-人間統合",unlock:"集合知制御・文明意思決定の統一",mile:"100万電極同時読み書き",
   media:"🎬 『マトリックス』(1999) — 脳とデジタルを直結するBCIの究極形。📚 ピーター・ワッツ『ブラインドサイト』— 意識とBCIの関係を探るハードSF",
   episode:"2052年、脊髄損傷で十年間寝たきりだった男性がBCIを装着した。「動け」と思った瞬間、ロボットアームがコーヒーを持ち上げた。彼は泣きながら自分でカップを口に運んだ。その映像は二十億回再生された。"},
  {id:"A5",t:4,cat:"情報科学",     name:"分散集合知AI",        year:"2100年頃",  diff:5,prereq:"マルチエージェントRL・AGI・BCI",breakthrough:"銀河スケール構造物の自律制御",unlock:"Type III以降の巨大インフラ運用",mile:"光年スケール遅延下での意思決定最適化",
   media:"📚 ヴァーナー・ヴィンジ『技術的特異点』— 知性爆発を初めて論じた論文。📚 グレッグ・ベア『ブラッド・ミュージック』— ナノAIが集合知になる物語",
   episode:"2103年、地球から4光年離れたプロキシマ基地のAIが局所的な意思決定を行い、太陽系のAIと整合を取っている。人間のオペレーターは「概要レポート」を朝食中に読むだけだ。「今日も宇宙は平和か」と彼は呟いた。"},
  {id:"P1",t:0,cat:"理論物理学",   name:"量子場理論の完全体系化",year:"2060年頃", diff:5,prereq:"QED・QCD・群論・トポロジー",breakthrough:"標準模型と重力の統一",unlock:"核力精密制御・量子重力",mile:"LHC後継機でのGUT粒子観測",
   media:"📚 グレッグ・イーガン『プランク・ダイブ』— 量子重力の極限を探るハードSF。🎬 『アニヒレーション 全滅領域』— 物理法則が書き換わった空間を探索する",
   episode:"2063年、物理学者が統一理論の最終方程式を黒板に書き終えた。彼女の指導教員だった老教授が病室で訃報を聞く前に「完成したか」とだけ尋ねた。「はい」という返事に、老人は目を閉じてそのまま眠るように笑った。"},
  {id:"P2",t:0,cat:"理論物理学",   name:"量子重力理論の確立",  year:"2100年頃",  diff:5,prereq:"一般相対性理論・量子力学・弦理論",breakthrough:"プランクスケール時空構造の解明",unlock:"ワープドライブ・ワームホール設計",mile:"重力波干渉計でのプランク長揺らぎ検出",
   media:"🎬 『インターステラー』— 時空の歪みと量子重力をビジュアル化した最高峰。📚 リサ・ランドール『ワープする宇宙』— 余剰次元と量子重力を解説する名著",
   episode:"2101年、重力波観測所の夜勤研究員がモニターに異常な揺らぎを見つけた。「これは……プランク長スケールの時空の泡だ」。彼は震える手でアラートを送った。翌朝、ノーベル委員会の電話が鳴った。"},
  {id:"P3",t:0,cat:"核物理学",     name:"核融合反応の完全制御",year:"2080年頃",  diff:5,prereq:"プラズマ物理・核力制御・QCD計算",breakthrough:"点火条件を任意設定・多段階融合反応",unlock:"商用核融合炉・反物質生成",mile:"Q>10の持続的融合反応",
   media:"📚 アーシュラ・K・ル=グウィン『所有せざる人々』— 核融合に依存する社会と無所有の惑星の対比。🎬 『スパイダーマン: ファー・フロム・ホーム』— 核融合的エネルギー技術が背景",
   episode:"2082年夏、南フランスのプラントで核融合炉が初めて安定稼働した。制御室で技術者が呟いた「これで石炭も石油もいらない」。外では抗議活動をしていた環境団体が、その夜静かに解散した。"},
  {id:"P4",t:0,cat:"物理学",       name:"常温常圧超電導体",    year:"2050年頃",  diff:5,prereq:"BCS理論・トポロジカル物質科学",breakthrough:"300K/1atm条件でゼロ抵抗確認",unlock:"100T超定常磁場・無損失送電",mile:"新規材料の工業規模製造",
   media:"📚 マイケル・クライトン『タイムライン』— 超電導・量子技術の応用を描くSF冒険譚。🎬 『アベンジャーズ』シリーズ — 超電導磁石を応用したアークリアクターが登場",
   episode:"2051年、材料研究所の助手が合成した新化合物の抵抗をゼロ度から常温まで測定した。抵抗がゼロのまま変わらなかった。彼女は装置の誤作動を疑い三回測り直した。四回目も同じだった。廊下を走って教授室に飛び込んだ。"},
  {id:"P5",t:0,cat:"物理学",       name:"超高強度レーザー物理",year:"2040年頃",  diff:4,prereq:"非線形光学・極限プラズマ物理・CPA",breakthrough:"10^25 W/cm² 安定発振",unlock:"ICF核融合・反物質対生成",mile:"電子-陽電子対生成の商用化",
   media:"🎬 『スター・ウォーズ』— デス・スターのレーザー砲が超高強度レーザーの究極形。📚 グレッグ・イーガン『クロックワーク・ロケット』— 光物理学を根本から再構築するSF",
   episode:"2042年、レーザー実験室で若手研究者がターゲットに極短パルスを照射した。ほんの一瞬、真空から電子と陽電子のペアが生まれた。「光から物質を作った」——アインシュタインのE=mc²が目の前で起きた。"},
  {id:"M1",t:0,cat:"材料科学",     name:"超耐熱セラミックス",  year:"2060年頃",  diff:4,prereq:"固体物理学・結晶化学・熱力学",breakthrough:"10,000K耐久・核融合炉壁材",unlock:"核融合炉建設・極超音速機体",mile:"W-Ta-Re合金500時間耐久試験通過",
   media:"🎬 『エイリアン』— 宇宙船の耐熱材料と未知素材の脅威が描かれる。📚 ハル・クレメント『重力の使命』— 極限環境と材料の関係を探るハードSF",
   episode:"2062年、炉壁試験場で作業員が新素材の壁パネルをトーチで炙った。一万度の炎の中、パネルは微動だにしなかった。「こいつは太陽の表面より熱い炎に耐えた」——その一枚が核融合炉の壁を守ることになった。"},
  {id:"M2",t:0,cat:"材料科学",     name:"超電導体量産化",      year:"2060年頃",  diff:4,prereq:"常温常圧超電導体・結晶工学",breakthrough:"超電導コイルコスト1/100",unlock:"大陸間超電導送電・磁気浮上",mile:"工業規模製造の確立",
   media:"🎬 『バック・トゥ・ザ・フューチャー Part II』— 磁気浮上ホバーボードが超電導の夢を描く。📺 『レールガン』（とある科学の）— 超電導と電磁加速を題材にしたアニメ",
   episode:"2063年、工場の生産ラインで超電導ワイヤーが巻き取られている。一キロのコストが昨年の百分の一になった。工場長は「これで送電ロスがなくなる」と笑った。その日の夕方、最初の超電導送電線の建設入札が始まった。"},
  {id:"M3",t:0,cat:"材料科学",     name:"プログラマブル物質",  year:"2150年頃",  diff:5,prereq:"ナノロボティクス・分子機械・量子コンピュータ",breakthrough:"原子単位で自己再構成する材料",unlock:"自己修復構造物・ダイソン球",mile:"10nm自己組織化構造の安定動作",
   media:"🎬 『ターミネーター2』— T-1000の液体金属が自己再構成するプログラマブル物質の象徴。📚 マイケル・クライトン『プレイ』— 自己複製するナノ粒子の暴走を描くSFスリラー",
   episode:"2153年、宇宙ステーションで微小隕石が外壁に穴を開けた。乗組員が修理キットを取り出す前に、壁面が自ら閉じた。プログラマブル素材が損傷を検知して再構成したのだ。船長は「材料が生きている」と記録に書いた。"},
  {id:"M4",t:0,cat:"材料科学",     name:"格子欠陥原子制御",    year:"2070年頃",  diff:4,prereq:"計算材料学・DFT・電子顕微鏡",breakthrough:"原子単位の欠陥除去・理論限界強度",unlock:"宇宙構造材・CNT量産化",mile:"CNT 100GPa量産",
   media:"📚 キム・スタンリー・ロビンソン『2312』— 軌道エレベーターを支えるカーボン素材が登場。🎬 『スパイダーマン』— クモの糸（炭素繊維的素材）が格子構造の強度を象徴",
   episode:"2072年、ナノ工場でカーボンナノチューブが一本一本欠陥なく生産されている。品質チェックを担当するAIが「今日の歩留まり99.97%」と報告した。その線材で作った橋は鋼鉄の百倍の強度を持ち、重さは十分の一だった。"},
  {id:"E1",t:0,cat:"エネルギー",   name:"磁気閉じ込めトカマク炉",year:"2090年頃",diff:4,prereq:"プラズマ物理・超電導・耐熱材料",breakthrough:"Q>1 商用核融合発電",unlock:"惑星エネルギーグリッド・宇宙推進",mile:"DEMO炉 1GW級発電",
   media:"📚 アーシュラ・K・ル=グウィン『所有せざる人々』— 核融合エネルギー社会の理想と現実。🎬 『チェーン・リアクション』(1996) — 核融合実用化を巡る陰謀サスペンス",
   episode:"2092年、DEMO炉の商用発電開始の朝、隣の街の送電計器の針がゆっくり上がった。配電管理者が確認した。「核融合電力が家庭に入った」。その日から、電力価格が下がり始め、翌年には石炭発電所の廃止ラッシュが始まった。"},
  {id:"E2",t:0,cat:"エネルギー",   name:"慣性閉じ込め核融合",  year:"2080年頃",  diff:4,prereq:"超高強度レーザー・核融合制御",breakthrough:"レーザー点火70%爆縮効率",unlock:"小型核融合炉・宇宙船エンジン",mile:"1000MJ級エネルギー利得",
   media:"🎬 『イベント・ホライゾン』— 超小型核融合ドライブで宇宙を旅する宇宙船が描かれる。📚 ラリー・ニーヴン『リングワールド』— 巨大エネルギーを扱う宇宙文明の描写",
   episode:"2081年、直径一センチの水素ペレットにレーザー百本が同時照射された。瞬間的な爆縮が起き、一千メガジュールのエネルギーが放出された。観測室の研究者が無言でガッツポーズをした——消費エネルギーの十五倍が出た。"},
  {id:"E3",t:0,cat:"エネルギー",   name:"宇宙太陽光発電(SSPS)", year:"2120年頃", diff:4,prereq:"軌道力学・マイクロ波工学",breakthrough:"天候非依存の宇宙発電",unlock:"惑星グリッド統合",mile:"GEO軌道1GW衛星群・WPT効率90%",
   media:"📺 『機動戦士ガンダム』— スペースコロニーのソーラーシステムが宇宙太陽光発電の原型。📚 アーサー・C・クラーク『楽園の泉』— 軌道エレベーターと宇宙エネルギーを描く古典",
   episode:"2122年曇り空の日、北海道の受電基地に宇宙から降り注ぐマイクロ波が届き続けた。天気に関係なく「太陽」が輝いている。担当技術者は「これで日本のエネルギー自給率が100%を超えた」とSNSに投稿した。"},
  {id:"E4",t:0,cat:"エネルギー",   name:"超大容量エネルギー貯蔵",year:"2040年頃",diff:3,prereq:"電気化学・固体物理学",breakthrough:"全固体電池500Wh/kg",unlock:"間欠性再エネの完全平滑化",mile:"全固体電池$50/kWh",
   media:"🎬 『エレクトリック・ドリームス』— 電力と意識が融合した未来を描くSFアンソロジー。📚 アンディ・ウィアー『火星の人』— 電力管理とエネルギー貯蔵が生死を分ける",
   episode:"2041年、砂漠の風力発電所の蓄電管理者が夜中に日誌を書く。「今夜は風がなかったが、電池に三日分を蓄えてある」。以前は風のない夜、隣の街が停電した。今は電池が空になる前に太陽が昇る。"},
  {id:"E5",t:0,cat:"エネルギー",   name:"水素経済の確立",      year:"2050年頃",  diff:3,prereq:"電気分解化学・触媒工学",breakthrough:"グリーン水素$1/kg",unlock:"長距離エネルギー輸送",mile:"1TW規模の水電解プラント",
   media:"🎬 『ハイドロゲン』— 水素社会への移行を描く近未来ドラマ。📚 ジュール・ヴェルヌ『謎の島』(1874) — 水を燃料とする未来を150年前に予言した驚異の小説",
   episode:"2052年、トラック運転手が水素ステーションで満タンにした。五分で充填完了。「ガソリンより速い」と彼は笑った。荷台には食料品。排気口からは水蒸気だけが出た。高速道路を走りながら、彼は初めて排ガスの臭いがないことに気づいた。"},
  {id:"E6",t:0,cat:"エネルギー",   name:"反物質生成・保存",    year:"2200年頃",  diff:5,prereq:"量子場理論・超高強度レーザー",breakthrough:"マイクログラム反物質保存",unlock:"反物質エンジン",mile:"反陽子1年間安定保存",
   media:"🎬 『天使と悪魔』— 反物質爆弾をめぐるサスペンス。CERNで生成された反物質が兵器化される。📚 ダン・ブラウン同名原作小説 — 反物質の危険性と可能性を大衆に広めた",
   episode:"2203年、反物質貯蔵施設の管理者が一年間の保存記録を確認した。磁気ボトルの中にマイクログラムの反陽子が静かに浮いている。彼女は「宇宙で最も危険な物質が、世界で最も安全な場所にある」と日記に書いた。"},
  {id:"G1",t:0,cat:"地球工学",     name:"精密気象予測(10年)",  year:"2060年頃",  diff:4,prereq:"気象学・カオス理論・AGI",breakthrough:"決定論的予測限界の突破",unlock:"農業最適化・災害防止",mile:"季節予測精度95%",
   media:"🎬 『デイ・アフター・トゥモロー』— 気象シミュレーション警告を無視した人類の末路。📚 マイケル・クライトン『ネクスト』— 気候データ操作の政治的危険性を描く",
   episode:"2062年、農家の老人が端末を見ている。「来年の夏は渇水、秋は豊雨」という十ヶ月先の予報だ。彼は種まきの計画を変えた。隣の農家は従来通りやって作物を半分失った。老人の畑だけが豊作だった。"},
  {id:"G2",t:0,cat:"地球工学",     name:"成層圏エアロゾル制御",year:"2080年頃",  diff:4,prereq:"大気物理学・気象予測",breakthrough:"全球温度±0.1K精度で制御",unlock:"Type I移行期の気候安定化",mile:"全球冷却0.5K・オゾン層維持",
   media:"🎬 『ジオストーム』— 気候制御衛星が暴走するSFサスペンス。📚 キム・スタンリー・ロビンソン『レッド・マーズ』— 惑星規模の気候改変の倫理的葛藤を描く",
   episode:"2083年夏、異常熱波が来るはずだった日、世界気候管理局が成層圏への硫酸塩散布を指示した。三日後、予報通り気温が0.3度下がった。ニューデリーの外で農作業をする老女が「今年の夏は涼しい」と息子にメッセージを送った。"},
  {id:"G3",t:0,cat:"地球工学",     name:"大気CO2直接制御",     year:"2070年頃",  diff:4,prereq:"化学工学・熱力学・DAC",breakthrough:"大気中300ppm以下へ削減",unlock:"炭素循環の完全制御",mile:"DACコスト$100/ton・年10GtCO2除去",
   media:"🎬 『インターステラー』— 枯れた農地と大気汚染が進んだ地球から逃げ出す物語。地球工学の失敗後を描く。📚 キム・スタンリー・ロビンソン『ニューヨーク2140』— 海面上昇後の都市を描く近未来小説"},
  {id:"G4",t:0,cat:"惑星工学",     name:"軌道リング建設",      year:"2300年頃",  diff:5,prereq:"プログラマブル物質・CNT・軌道力学",breakthrough:"赤道周回12,800km環状構造物",unlock:"軌道大量輸送・太陽エネルギー収集",mile:"静止軌道自己支持型リング初節稼働",
   media:"📚 アーサー・C・クラーク『楽園の泉』— 軌道エレベーターと宇宙構造物建設の先駆的ビジョン。🎬 『エリジウム』— 軌道上に建設された富裕層のリング型コロニー",
   episode:"2302年、赤道上空で軌道リングの第一節が完成した。ブラジルの漁師が夜明けに空を見ると、星のような光の帯が東から西へ動いていた。「あれが人間の作ったものか」と彼は呟いた。息子が「あそこからエレベーターで宇宙に行けるんだよ」と教えた。"},
  {id:"G5",t:0,cat:"惑星工学",     name:"惑星磁場・アルベド制御",year:"2350年頃",diff:5,prereq:"地球物理学・MHD理論・核融合",breakthrough:"地球磁気圏強度±10%調整",unlock:"宇宙線防護・惑星環境設計",mile:"南極域の磁場強度10%増強",
   media:"📚 キム・スタンリー・ロビンソン『グリーン・マーズ』— 火星の磁場生成プロセスが詳細に描かれる。🎬 『ザ・コア』— 地球の磁場崩壊を描くSFパニック映画",
   episode:"2355年、極圏の研究基地で科学者がオーロラの強度変化を記録した。地球の磁場が人為的に強化されたことで、宇宙線が以前の30%まで低減された。「これで火星テラフォーミングの磁場設計に使える」と彼女はノートに書いた。"},
  {id:"G6",t:0,cat:"惑星工学",     name:"完全テラフォーミング", year:"2400年頃",  diff:5,prereq:"地球システム科学・生態工学",breakthrough:"任意の気候状態への移行",unlock:"火星/金星テラフォーミング",mile:"火星大気圧0.5気圧・気温10℃到達",
   media:"📚 キム・スタンリー・ロビンソン『レッド・マーズ』三部作 — テラフォーミングの全過程を描いたSFの金字塔。🎬 『テラフォーマーズ』— 火星改造と生命工学を題材にしたアニメ",
   episode:"2405年、火星北緯45度の平原で最初の入植者が防護服なしで外に出た。気圧は地球の半分、気温は10℃。薄い大気に風が吹き、遠くに雲が見えた。彼女は膝をついて赤い土を握った。「ここが第二の故郷になる」"},
  {id:"I1",t:0,cat:"インフラ",     name:"大陸間超電導送電",    year:"2100年頃",  diff:4,prereq:"超電導体量産化・電力工学",breakthrough:"10,000km無損失伝送",unlock:"全球電力網統一",mile:"ユーラシア横断超電導線初稼働",
   media:"📚 アシモフ『ファウンデーションと地球』— 銀河規模のエネルギーネットワークが描かれる。🎬 『トロン：レガシー』— 情報・電力インフラとデジタル世界の融合",
   episode:"2103年、モスクワの送電管理室で技術者が確認した。「リスボン発の電力がウラジオストクに届いている、損失0.1%以下」。一万キロを経て電子がほぼそのまま届いた。「人類が初めて大陸を一本の電線でつないだ」"},
  {id:"I2",t:0,cat:"インフラ",     name:"グローバル電力網同期",year:"2150年頃",  diff:3,prereq:"スマートグリッド・AGI",breakthrough:"全地球リアルタイム需給制御",unlock:"惑星エネルギー完全制御",mile:"全大陸電力網の単一システム統合",
   media:"🎬 『ダイ・ハード4.0』— 電力インフラへのサイバー攻撃で文明が崩壊する恐怖。📺 『ブラックアウト』— 全欧州停電の72時間を描くドイツのSFドラマ",
   episode:"2152年、地球電力管理AIが北アフリカの太陽光余剰電力をリアルタイムで日本の夜間需要に振り向けた。停電ゼロの地球が始まった朝、各地の電力会社の掲示板に「今日の需給バランス：完璧」と表示された。"},
  {id:"I3",t:0,cat:"インフラ",     name:"軌道エレベーター",    year:"2200年頃",  diff:5,prereq:"CNT量産化・軌道力学",breakthrough:"宇宙へのコスト$100/kg以下",unlock:"ダイソン球建設資材輸送",mile:"CNTテザー静止軌道到達",
   media:"📚 アーサー・C・クラーク『楽園の泉』— 軌道エレベーター建設を描いたSFの古典的名作。📚 キム・スタンリー・ロビンソン『2312』— 軌道エレベーターが日常的なインフラとなった世界",
   episode:"2203年、軌道エレベーターの初の有人乗客便が出発した。乗客は農業用ドローン部品を運ぶ配送員だった。三十六時間後、静止軌道に着いた彼は窓から青い地球を見た。「こんなに安く来られるなら、来週また来よう」と呟いた。"},
  {id:"S1",t:1,cat:"宇宙推進",     name:"相対論的推進理論",    year:"2300年頃",  diff:5,prereq:"特殊相対性理論・GR補正・反物質",breakthrough:"光速10%以上での恒星間航行設計",unlock:"反物質エンジン実用化",mile:"0.1c到達の推進ミッション計算完成",
   media:"📚 ポール・アンダースン『タウ・ゼロ』— 減速できない宇宙船が光速に近づくにつれ宇宙の終末まで旅するSF。🎬 『アド・アストラ』— 恒星間推進技術と人間の孤独を描く",
   episode:"2305年、宇宙推進研究所の主任が三十年がかりの計算を完成させた。「0.1cで飛べば、プロキシマへは43年で着ける」。彼は自分が生きている間に到着できないと知りながら、設計書に署名した。孫の世代への贈り物だった。"},

// ─────────────────────────────────────────────────────
// FORCE-DIRECTED LAYOUT (X固定, Y/Z物理反発)
// ─────────────────────────────────────────────────────
const NM = {};
NODES.forEach(n => {
  n.px = X_T[String(n.t)] ?? 0;       // X軸 = 時代 (固定)
  n.py = (Math.random() - 0.5) * 400; // Y初期値
  n.pz = (Math.random() - 0.5) * 400; // Z初期値
  n.vy = 0; n.vz = 0;                 // 速度
  NM[n.id] = n;
});

function runForce(iterations) {
  const REPULSION  = 18000;  // ノード間反発
  const ATTRACTION = 0.015;  // エッジ引力
  const DAMPING    = 0.82;   // 速度減衰
  const MAX_SPEED  = 8;

  for (let iter = 0; iter < iterations; iter++) {
    // 反発: 全ペア
    for (let i = 0; i < NODES.length; i++) {
      for (let j = i + 1; j < NODES.length; j++) {
        const a = NODES[i], b = NODES[j];
        const dy = b.py - a.py;
        const dz = b.pz - a.pz;
        const dist2 = dy*dy + dz*dz + 1;
        const force = REPULSION / dist2;
        const fy = force * dy / Math.sqrt(dist2);
        const fz = force * dz / Math.sqrt(dist2);
        a.vy -= fy; a.vz -= fz;
        b.vy += fy; b.vz += fz;
      }
    }
    // 引力: エッジ
    EDGES.forEach(([fid, tid]) => {
      const a = NM[fid], b = NM[tid];
      if (!a || !b) return;
      const dy = b.py - a.py;
      const dz = b.pz - a.pz;
      a.vy += dy * ATTRACTION;
      a.vz += dz * ATTRACTION;
      b.vy -= dy * ATTRACTION;
      b.vz -= dz * ATTRACTION;
    });
    // 中心引力(ドリフト防止)
    NODES.forEach(n => {
      n.vy -= n.py * 0.003;
      n.vz -= n.pz * 0.003;
    });
    // 速度制限 & 位置更新
    NODES.forEach(n => {
      n.vy *= DAMPING; n.vz *= DAMPING;
      const spd = Math.sqrt(n.vy*n.vy + n.vz*n.vz);
      if (spd > MAX_SPEED) { n.vy = n.vy/spd*MAX_SPEED; n.vz = n.vz/spd*MAX_SPEED; }
      n.py += n.vy;
      n.pz += n.vz;
    });
  }
}

// 初期シミュレーション
runForce(300);

function mkTex(n) {
  const cv = document.createElement("canvas");
  cv.width = 256; cv.height = 112;
  const ctx = cv.getContext("2d");
  const col = tc(n.t).hex;

  ctx.beginPath();
  const r=10,x=3,y=3,w=250,h=106;
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  ctx.fillStyle = "rgba(3,7,18,0.93)";
  ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = col; ctx.globalAlpha = 0.7;
  ctx.font = "bold 10px sans-serif";
  ctx.fillText(n.cat.toUpperCase(), 10, 20);
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#fbbf24"; ctx.font = "10px sans-serif";
  ctx.textAlign = "right"; ctx.fillText("★".repeat(n.diff), 246, 20);
  ctx.textAlign = "left";

  ctx.fillStyle = "#f1f5f9"; ctx.font = "bold 14px sans-serif";
  const nm = n.name;
  if (nm.length > 11) { ctx.fillText(nm.slice(0,11), 10, 46); ctx.fillText(nm.slice(11), 10, 63); }
  else ctx.fillText(nm, 10, 54);

  ctx.fillStyle = col; ctx.globalAlpha = 0.15; ctx.fillRect(10,74,236,26);

  ctx.fillStyle = col; ctx.font = "bold 11px monospace";

  return new THREE.CanvasTexture(cv);
}

// EDGES
// ─────────────────────────────────────────────────────
const eg = new THREE.Group();
const EO = [];

function buildEdges() {
  // 既存を削除
  while (eg.children.length) eg.remove(eg.children[0]);
  EO.length = 0;
  EDGES.forEach(([fid, tid]) => {
    const a = NM[fid], b = NM[tid];
    if (!a || !b) return;
    const col = tc(b.t).col;
    const mid = new THREE.Vector3(
      (a.px+b.px)/2,
      (a.py+b.py)/2 + (Math.random()-0.5)*20,
      (a.pz+b.pz)/2 + (Math.random()-0.5)*20
    );
    const pts = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(a.px, a.py, a.pz), mid, new THREE.Vector3(b.px, b.py, b.pz)
    ).getPoints(24);
    const mat = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.18 });
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
    eg.add(line);
    EO.push({ line, mat, fid, tid, col });
  });
}
buildEdges();
scene.add(eg);

function camU() {
  camera.position.x = panX + dist*Math.sin(theta)*Math.cos(phi);
  camera.position.y = panY + dist*Math.sin(phi);
  camera.position.z = dist*Math.cos(theta)*Math.cos(phi);

    pinchStartDist=Math.hypot(dx,dy); pinchStartTd=td;

  const hits = rc.intersectObjects(cores);
  if (hits.length) return NODES.find(n => MESHES[n.id].core === hits[0].object);

// ANIMATE
// ─────────────────────────────────────────────────────
const clk = new THREE.Clock();
const L = (a,b,t) => a+(b-a)*t;

function getBgLevelFromCamera(camX) {
  const levels = ['-2','-1','4','0','1','2','3'];
  const xs = [-900,-560,80,-100,400,720,1020];
  let best=0, bestD=Infinity;
  xs.forEach((x,i)=>{ const d=Math.abs(camX-x); if(d<bestD){bestD=d;best=i;} });
  return levels[best];
}

function loop() {
  requestAnimationFrame(loop);
  const el = clk.getElapsedTime();
  const k = 0.08;
  phi=L(phi,tp,k); theta=L(theta,tt,k); dist=L(dist,td,k); panX=L(panX,tpx,k); panY=L(panY,tpy,k);
  if (spin) tt += 0.003;
  camU();

  NODES.forEach(n => {
    const m = MESHES[n.id];
    // 浮遊アニメ (Y方向のみ微小)
    const fy = n.py + Math.sin(el*0.6 + n.px*0.006)*2.5;
    m.plate.position.y = fy;
    m.core.position.y  = fy;
    m.glow.position.y  = fy;
    m.plate.lookAt(camera.position);

    const act = hvId===n.id || selId===n.id;
    m.cm.emissiveIntensity = L(m.cm.emissiveIntensity, act?3.5:1.5, 0.1);
    m.gm.opacity = L(m.gm.opacity, act?0.45:0.1, 0.1);
    const ts = act ? 2.5 : 1.0;
    m.glow.scale.x = L(m.glow.scale.x, ts, 0.1);
    m.glow.scale.y = m.glow.scale.z = m.glow.scale.x;
  });

  EO.forEach((e, i) => {
    if (!e.line.visible) return;
    if (selId && (e.fid===selId || e.tid===selId))
      e.mat.opacity = 0.5 + Math.sin(el*4 + i*0.4)*0.45;
  });

  // カメラ位置に応じた背景自動切り替え
  if (!selId) {
    const newBgLevel = getBgLevelFromCamera(panX);
    if(newBgLevel !== currentBgLevel) {
      startBgAnim(newBgLevel);
    }
  }

  renderer.render(scene, camera);
}
loop();

(function startIntro() {
  // カメラを遠くから飛び込むイントロ
  const introStartDist = 12000;
  dist = introStartDist; td = introStartDist;

  const titleEl = document.getElementById("intro-title");
  const subEl   = document.getElementById("intro-sub");

  // フェードイン
  setTimeout(() => { titleEl.classList.add("show"); subEl.classList.add("show"); barEl.classList.add("show"); }, 200);
  // バー伸びる
  setTimeout(() => { fillEl.style.width = "100%"; }, 300);

  // カメラズームイン (introStartDist → 1800) over 3s
  const zoomDuration = 3200;
  const zoomStart = performance.now();
  const targetDist = 1800;

  function zoomStep(now) {
    const elapsed = now - zoomStart;
    const t = Math.min(elapsed / zoomDuration, 1);
    // easeOutQuint
    const ease = 1 - Math.pow(1 - t, 5);
    td = introStartDist + (targetDist - introStartDist) * ease;
    if (t < 1) requestAnimationFrame(zoomStep);
  }
  requestAnimationFrame(zoomStep);

  // 2.8s後にフェードアウト
  setTimeout(() => {
    introEl.classList.add("hidden");
    setTimeout(() => { introEl.style.display = "none"; }, 1300);
    td = targetDist;
  }, 2800);
})();

// UNLOCK FX
// ─────────────────────────────────────────────────────
const flashOverlay = document.getElementById("flash-overlay");
const unlockText = document.getElementById("unlock-text");

function triggerUnlock(node) {
  const col = tc(node.t).hex;
  // フラッシュ
  flashOverlay.style.opacity = "0.3";
  setTimeout(() => { flashOverlay.style.opacity = "0"; }, 150);
  // テキスト
  unlockText.style.color = col;
  unlockText.classList.remove("pop","fade");
  void unlockText.offsetWidth; // reflow
  unlockText.classList.add("pop");
  setTimeout(() => {
    unlockText.classList.remove("pop");
    unlockText.classList.add("fade");
  }, 800);
  setTimeout(() => { unlockText.classList.remove("fade"); }, 1500);

  // Three.js パーティクル
  const nodePos = new THREE.Vector3(node.px, node.py, node.pz);
  const count = 50;
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i*3]   = nodePos.x;
    positions[i*3+1] = nodePos.y;
    positions[i*3+2] = nodePos.z;
    velocities.push(new THREE.Vector3(
      (Math.random()-0.5)*6,
      (Math.random()-0.5)*6,
      (Math.random()-0.5)*6
    ));
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute("position", new THREE.BufferAttribute(positions.slice(), 3));
  const pMat = new THREE.PointsMaterial({ color: col, size: 3, transparent: true, opacity: 1 });
  const pts = new THREE.Points(pGeo, pMat);
  scene.add(pts);

  const startTime = performance.now();
  const dur = 1500;
  const posAttr = pGeo.attributes.position;
  function animParticles(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / dur, 1);
    pMat.opacity = 1 - t;
    for (let i = 0; i < count; i++) {
      posAttr.setXYZ(i,
        nodePos.x + velocities[i].x * elapsed * 0.1,
        nodePos.y + velocities[i].y * elapsed * 0.1,
        nodePos.z + velocities[i].z * elapsed * 0.1
      );
    }
    posAttr.needsUpdate = true;
    if (t < 1) requestAnimationFrame(animParticles);
    else { scene.remove(pts); pGeo.dispose(); pMat.dispose(); }
  }
  requestAnimationFrame(animParticles);
}

// ─────────────────────────────────────────────────────
// PROGRESS TRACKING
// ─────────────────────────────────────────────────────
const visitedNodes = new Set();

function updateProgress() {
  const total = NODES.length;
  const count = visitedNodes.size;
  document.getElementById("prog-count").textContent = count;
  document.getElementById("prog-total").textContent = total;
  document.getElementById("prog-bar").style.width = (count / total * 100) + "%";
}

// 初期化
(function initProgress() {
  document.getElementById("prog-total").textContent = NODES.length;
})();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
